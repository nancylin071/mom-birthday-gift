<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>gift card render</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Noto+Serif+TC:wght@400;600;700&display=block">
<style>
  :root { --paper:#FFFCF7; --gold:#B89562; --gold-dark:#8E6C43; --text:#493B30; --muted:#796A5B; --border:#D9C5A8;
    --zh:"Noto Serif TC","Songti TC",serif; --en:"Cormorant Garamond","Didot",serif;
    --foil-bright: linear-gradient(100deg, #7A5A33 0%, #A9844F 16%, #DFC38E 31%, #C49E63 45%, #8E6C43 60%, #D9BE8C 78%, #8A693F 100%);
    --foil-deep: linear-gradient(100deg, #5E4428 0%, #8E6C43 28%, #B08A55 50%, #8E6C43 72%, #5E4428 100%); }
  * { box-sizing:border-box; margin:0; }
  html,body { width:1200px; height:800px; overflow:hidden; }
  body { background:#F7F1E8; font-family:var(--zh); color:var(--text); -webkit-font-smoothing:antialiased; }
  .foil, .foil-dark { -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; }
  .foil { background-image:var(--foil-bright); background-size:220% 100%; background-position:30% 0; }
  .foil-dark { background-image:var(--foil-deep); background-size:160% 100%; background-position:50% 0; }
  .card { position:absolute; inset:0; padding:70px 90px;
    background:
      radial-gradient(ellipse at 34% 50%, rgba(255,252,247,.97) 0%, rgba(255,252,247,.84) 42%, rgba(255,252,247,.62) 100%),
      url("../assets/guilloche.svg") 0 0 / 56px 28px,
      linear-gradient(180deg, #FFFCF7 0%, #FAF2E4 100%);
    display:grid; grid-template-columns: 1.25fr auto 1fr; align-items:center; column-gap:60px; }
  .b1 { position:absolute; inset:22px; border:1.5px solid rgba(184,149,98,.72); }
  .b2 { position:absolute; inset:29px; border:1px solid rgba(184,149,98,.32); }
  .c { position:absolute; width:84px; height:84px; background:url("../assets/corner.svg") center/contain no-repeat; }
  .tl{top:34px;left:34px} .tr{top:34px;right:34px;transform:scaleX(-1)}
  .bl{bottom:34px;left:34px;transform:scaleY(-1)} .br{bottom:34px;right:34px;transform:scale(-1,-1)}
  .left { text-align:center; }
  .crest { display:block; width:120px; margin:0 auto 14px; }
  .en { font-family:var(--en); font-weight:700; font-size:46px; letter-spacing:.14em; padding-left:.14em; line-height:1.15; }
  .occ { margin-top:10px; font-family:var(--en); font-weight:700; font-size:17px; letter-spacing:.42em; padding-left:.42em; color:var(--gold-dark); }
  .title { display:inline-block; margin-top:30px; padding:8px .9em 8px 1.06em; font-size:38px; font-weight:700; letter-spacing:.16em;
    border-top:1.5px solid rgba(184,149,98,.5); border-bottom:1.5px solid rgba(184,149,98,.5); }
  .amt { margin-top:14px; font-family:var(--en); font-weight:600; line-height:1.05; white-space:nowrap; }
  .amt .cur { font-size:44px; margin-right:8px; font-weight:700; }
  .amt .num { font-size:132px; font-feature-settings:"lnum" 1; filter: drop-shadow(0 2px 0 rgba(255,255,255,.85)) drop-shadow(0 4px 10px rgba(142,108,67,.2)); }
  .core { margin-top:22px; font-size:24px; font-weight:600; line-height:1.75; }
  .vr { width:1px; height:540px; background:linear-gradient(rgba(184,149,98,0), rgba(184,149,98,.75) 20%, rgba(184,149,98,.75) 80%, rgba(184,149,98,0)); position:relative; }
  .vr::after { content:""; position:absolute; left:50%; top:50%; width:9px; height:9px; background:#FFFCF7; border:1.5px solid var(--gold); transform:translate(-50%,-50%) rotate(45deg); }
  .right { text-align:left; }
  .h { font-size:18px; font-weight:600; letter-spacing:.32em; color:var(--gold-dark); }
  .div { display:block; width:150px; height:16px; margin:14px 0 4px; background:url("../assets/divider.svg") left center/contain no-repeat; }
  .u { margin-top:12px; font-size:20px; line-height:1.85; color:var(--muted); }
  .u + .u { margin-top:14px; }
  .nl { display:inline-block; margin-top:24px; padding:6px 24px; border:1.5px solid rgba(184,149,98,.7); border-radius:999px;
    box-shadow: inset 0 0 0 3px #FFFCF7, inset 0 0 0 4px rgba(184,149,98,.3); background:#FFFCF7;
    font-size:19px; font-weight:600; letter-spacing:.16em; color:var(--gold-dark); }
  .sign { margin-top:44px; }
  .with { font-family:var(--en); font-weight:700; font-size:16px; letter-spacing:.38em; color:var(--gold-dark); }
  .names { margin-top:6px; font-family:var(--en); font-style:italic; font-weight:600; font-size:38px; letter-spacing:.02em; line-height:1.3; }
</style>
</head>
<body>
<div class="card">
  <span class="b1"></span><span class="b2"></span>
  <span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span>
  <div class="left">
    <img class="crest" src="../assets/crest.svg" alt="">
    <p class="en foil-dark">A GIFT FOR MOM</p>
    <p class="occ">HAPPY BIRTHDAY</p>
    <p class="title">媽媽專屬變美基金</p>
    <p class="amt"><span class="cur foil">NT$</span><span class="num foil">36,000</span></p>
    <p class="core">想變漂亮，還是想變健康，<br>都由妳決定。</p>
  </div>
  <span class="vr"></span>
  <div class="right">
    <p class="h">使用方式</p>
    <p class="u">可用於醫美諮詢、適合的抗老療程、<br>專業體重管理，或其他健康保養計畫。</p>
    <p class="u">先確認適合的方式，<br>再由我們三個負責買單。</p>
    <p class="nl">不限使用日期</p>
    <div class="sign">
      <p class="with">WITH LOVE,</p>
      <p class="names foil-dark">Steven · Kevin · Nancy</p>
    </div>
  </div>
</div>
</body>
</html>
