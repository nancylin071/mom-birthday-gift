<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>og render</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+TC:wght@400;600;700&display=block">
<link rel="stylesheet" href="../style.css">
<style>
  html,body { width:1200px; height:630px; overflow:hidden; min-height:0; }
  .wrap { position:relative; z-index:1; height:630px; display:grid; grid-template-columns: 1fr 1fr; align-items:center; padding:0 90px; gap:40px; }
  .frame { top:18px; bottom:18px; left:18px; right:18px; }
  .envelope { --w: 440px; }
  .txt { text-align:left; }
  .txt .eyebrow { font-size:20px; padding-left:0; }
  .txt .title-zh { font-size:52px; margin-top:22px; }
  .txt .from { margin-top:22px; font-family:var(--serif-en); font-style:italic; font-size:30px; color:var(--gold-dark); }
</style>
</head>
<body>
<div class="frame"></div>
<div class="wrap">
  <div class="envelope" style="cursor:default">
    <span class="env-back"></span>
    <span class="env-letter"><span class="env-letter-line">HAPPY BIRTHDAY</span><span class="env-letter-rule"></span></span>
    <span class="env-pocket"></span>
    <span class="env-flap"><span class="env-flap-inner"></span></span>
    <span class="env-seal"><span>M</span></span>
  </div>
  <div class="txt">
    <p class="eyebrow">A SPECIAL GIFT FOR MOM</p>
    <p class="title-zh">媽媽，生日快樂！</p>
    <p class="from">from Steven · Kevin · Nancy</p>
  </div>
</div>
</body>
</html>
